[project]
name = "invoiceflow-backend"
version = "1.0.0"
description = "InvoiceFlow Enterprise Invoice Approval Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "supabase>=2.11.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0",
    "fpdf2>=2.8.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
